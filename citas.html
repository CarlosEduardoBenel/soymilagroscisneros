            <form>

                <div class="datos-nombre">
                    <label for="nombre">Nombre y Apellido</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Nombres y Apellidos"
                    >
                </div>

                <div class="datos-correo">
                    <label for="correo">Correo</label>
                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        placeholder="Ej: milagros@example.com"
                    >
                </div>

                <div class="datos-whatsapp">
                    <label for="whatsapp">WhatsApp</label>
                    <input 
                        type="tel" 
                        id="whatsapp" 
                        name="whatsapp" 
                        placeholder="Número de WhatsApp"
                    >
                </div>

                <div class="datos-terapia">
                    <label for="terapia">Terapia</label>
                    <select name="terapia" id="terapia">
                        <option disabled selected value="">Selecciona tu terapia</option>
                        <option value="TE_SRC">Sesión Raíz Consciente</option>
                        <option value="TE_SPL">Sanación Pleyadiana</option>
                        <option value="TE_TAM">Tameana</option>
                        <option value="TE_AG">Árbol Genealógico</option>
                        <option value="TE_LE">Liberación de Emociones</option>
                        <option value="TE_RA">Registros Akáshicos</option>
                        <option value="TE_HE">Hipnosis Ericksoniana</option>
                        <option value="TE_CA">Cirugía Astral</option>
                        <option value="TE_KI">Kepri de Isis</option>
                        <option value="TE_LLA">Limpieza con Llave Ankh</option>
                        <option value="TE_RE">Reiki</option>
                        <option value="TE_AC">Access Consciousness</option>
                    </select>
                </div>

                <div class="datos-mensaje">
                    <label for="mensaje">Cuéntanos, si deseas, qué te gustaría trabajar</label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe aquí..."
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit">Solicitar Cita</button>

            </form>

        </section>
