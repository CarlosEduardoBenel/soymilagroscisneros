<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/componentes/global/global.css">
    <link rel="stylesheet" href="/paginas/citas/citas.css">
    <title>Solicita tu cita</title>
</head>
<body>
    <!-- Seccion Header -->
    <div id="header"></div>

    <main>
        <section class="registro">

            <h1>Elige la mejor terapia para ti</h1>

            <form>

                <div class="datos-nombre">
                    <label for="nombre">Nombre y Apellido</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Nombres y Apellidos"
                        required autocomplete="name"
                    >
                </div>

                <div class="datos-correo">
                    <label for="correo">Correo</label>
                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        placeholder="Ej: milagros@example.com"
                        required autocomplete="email"
                    >
                </div>

                <div class="datos-whatsapp">
                    <label for="whatsapp">WhatsApp</label>

                    <div class="telefono">
                        <select id="codigo" name="codigo" aria-label="Código de país" required>
                            <option value="+51">Perú +51</option>
                            <option value="+52">México +52</option>
                            <option value="+1" selected>EE. UU. / Canadá +1</option>
                            <option value="+57">Colombia +57</option>
                            <option value="+56">Chile +56</option>
                            <option value="+54">Argentina +54</option>
                            <option value="+593">Ecuador +593</option>
                            <option value="+591">Bolivia +591</option>
                            <option value="+58">Venezuela +58</option>
                            <option value="+53">Cuba +53</option>
                            <option value="+34">España +34</option>
                        </select>

                        <input
                            type="tel"
                            id="whatsapp"
                            name="whatsapp"
                            placeholder="Ej: 987654321"
                            inputmode="numeric"
                            autocomplete="tel-national"
                            required
                        >
                    </div>
                </div>

                <div class="datos-terapia">
                    <label for="terapia">Terapia</label>
                    <select name="terapia" id="terapia" required>
                        <option disabled selected value="">Selecciona tu terapia</option>
                        <option value="TE_SRC">Sesión Raíz Consciente</option>
                        <option value="TE_SPL">Sanación Pleyadiana</option>
                        <option value="TE_TAM">Tameana</option>
                        <option value="TE_AG">Árbol Genealógico</option>
                        <option value="TE_LE">Liberación de Emociones</option>
                        <option value="TE_RA">Registros Akáshicos</option>
                        <option value="TE_HE">Hipnosis Ericksoniana</option>
                        <option value="TE_CA">Cirugía Astral</option>
                        <option value="TE_KI">Kepri de Isis</option>
                        <option value="TE_LLA">Limpieza con Llave Ankh</option>
                        <option value="TE_RE">Reiki</option>
                        <option value="TE_AC">Access Consciousness</option>
                    </select>
                </div>

                <div class="datos-mensaje">
                    <label for="mensaje">Cuéntanos, si deseas, qué te gustaría trabajar</label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe aquí..."
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit">Solicitar Cita</button>

            </form>

        </section>
    </main>

    <!-- Seccion footer-->
    <div id="footer"></div>
    
    <script src="/js/main.js"></script>
    <script src="/paginas/citas/citas.js"></script>
</body>
</html>
